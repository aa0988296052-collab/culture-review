
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文創產業理論與實務 - 複習筆記</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #2f3542;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        /* 選單按鈕 */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: #dfe4ea;
            color: var(--text);
            font-weight: bold;
            transition: 0.3s;
        }

        .btn.active, .btn:hover {
            background: var(--primary);
            color: white;
        }

        /* 內容區塊 */
        .section {
            display: none; /* 預設隱藏 */
            animation: fadeIn 0.5s;
        }

        .section.active {
            display: block; /* 啟用時顯示 */
        }

        /* 卡片設計 */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s;
            border-left: 5px solid var(--accent);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card h3::after {
            content: '+';
            font-size: 1.2em;
            color: #ccc;
        }

        .card.open h3::after {
            content: '-';
        }

        .answer {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #57606f;
        }

        .tag {
            display: inline-block;
            background: #eccc68;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>文創產業理論與實務</h1>
        <p class="subtitle">Chapter 1 重點複習 | 點擊卡片查看詳解</p>
    </header>

    <div class="nav-buttons">
        <button class="btn active" onclick="showSection('intro')">產業定義與興起</button>
        <button class="btn" onclick="showSection('types')">台灣產業範疇</button>
        <button class="btn" onclick="showSection('theory')">文化理論學派</button>
        <button class="btn" onclick="showSection('dilemma')">發展困境與反思</button>
    </div>

    <div id="intro" class="section active"></div>
    <div id="types" class="section"></div>
    <div id="theory" class="section"></div>
    <div id="dilemma" class="section"></div>
</div>

<div id="status-console" style="position: fixed; bottom: 10px; right: 10px; background: #333; color: #fff; padding: 10px; border-radius: 5px; font-size: 12px; font-family: monospace; z-index: 999; max-width: 300px; opacity: 0.9;">
    系統準備中...
</div>

<script>
    // ==========================================
    // 1. 資料庫 (PPT 內容)
    // ==========================================
    const data = {
        intro: [
            {
                title: "文化工業 (Culture Industry)",
                content: "由法蘭克福學派學者阿多諾 (Adorno) 和霍克海默 (Horkheimer) 於 1960 年代提出。特點包括：<br>1. 生產過程類似現代大工業。<br>2. 與科學技術緊密結合。<br>3. 大眾成為被動消費者而非主體。",
                tag: "起源"
            },
            {
                title: "英國創意產業定義 (1997)",
                content: "由布萊爾 (Blair) 政府提出：「起源於個體創意、技巧及才能，通過知識產權的生成與利用，有潛力創造財富和就業機會的產業。」",
                tag: "政策"
            },
            {
                title: "台灣文化創意產業定義 (2004)",
                content: "文建會定義：「源自創意及文化積累，透過智慧財產的形成與運用，具有創造財富與就業機會潛力，並促進整體生活提升的行業。」",
                tag: "台灣"
            },
            {
                title: "文創產業的經濟特性",
                content: "根據 Hesmondhalgh：<br>1. 高風險 (High Risk)<br>2. 半公共財<br>3. 生產成本高，再製成本低<br>4. 類型化商品",
                tag: "特性"
            }
        ],
        types: [
            {
                title: "六大旗艦產業 (2009)",
                content: "行政院選定：工藝、設計、數位內容、電影、電視、流行音樂。",
                tag: "重點"
            },
            {
                title: "15+1 產業範疇 (文化部主管)",
                content: "視覺藝術、音樂及表演藝術、文化資產應用、工藝、電影、廣播電視、出版。",
                tag: "分類"
            },
            {
                title: "15+1 產業範疇 (經濟部主管)",
                content: "廣告、產品設計、視覺傳達設計、設計品牌時尚、數位內容、創意生活。",
                tag: "分類"
            },
            {
                title: "15+1 產業範疇 (內政部主管)",
                content: "建築設計產業。",
                tag: "分類"
            }
        ],
        theory: [
            {
                title: "泰勒 (Tylor) 的文化定義",
                content: "「文化是人作為社會成員所獲得的複合整體，包括知識、信仰、藝術、道德、法律、風俗等能力和習慣。」",
                tag: "人類學"
            },
            {
                title: "結構主義 (Structuralism)",
                content: "代表人物：李維史陀 (Levi-Strauss)。<br>觀點：文化是人類對自然的模擬，透過「二元對立」的關係（如：男/女、生/熟）來賦予意義。",
                tag: "李維史陀"
            },
            {
                title: "後結構主義 - 羅蘭巴特 (Roland Barthes)",
                content: "觀點：「作者已死」。文本意義不是由作者決定，而是由讀者（消費者）在閱讀過程中完成的。強調讀者的體驗。",
                tag: "符號學"
            },
            {
                title: "解構主義 - 德希達 (Derrida)",
                content: "觀點：反對絕對的「中心」與「權威」。神話與意義是流動的、無中心的。這啟發文創產業要勇於挑戰傳統、打破邊陲與中心的界線。",
                tag: "解構"
            }
        ],
        dilemma: [
            {
                title: "文創發展的兩難",
                content: "「提升產值」 (經濟利益) vs. 「重視人文」 (文化關懷) 的拉鋸。",
                tag: "核心問題"
            },
            {
                title: "CSR (企業社會責任) 的角色",
                content: "作為平衡兩難的解方：<br>1. 好的公司治理<br>2. 對人的責任<br>3. 對環境的責任<br>4. 對社會發展的貢獻",
                tag: "解決方案"
            }
        ]
    };

    // ==========================================
    // 2. 核心功能
    // ==========================================
    function render() {
        for (const [key, items] of Object.entries(data)) {
            const container = document.getElementById(key);
            if (!container) continue;
            
            container.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = function() {
                    this.classList.toggle('open');
                    const ans = this.querySelector('.answer');
                    ans.style.display = ans.style.display === 'block' ? 'none' : 'block';
                };
                
                card.innerHTML = `
                    <h3><span><span class="tag">${item.tag}</span>${item.title}</span></h3>
                    <div class="answer">${item.content}</div>
                `;
                container.appendChild(card);
            });
        }
    }

    window.showSection = function(id) {
        document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.btn').forEach(el => el.classList.remove('active'));
        
        const target = document.getElementById(id);
        if(target) target.classList.add('active');
        
        const btnMap = { 'intro': 0, 'types': 1, 'theory': 2, 'dilemma': 3 };
        const buttons = document.querySelectorAll('.btn');
        if (buttons[btnMap[id]]) buttons[btnMap[id]].classList.add('active');
    }

    // ==========================================
    // 3. 自動化測試系統
    // ==========================================
    function runSystemCheck() {
        const consoleDiv = document.getElementById('status-console');
        let logs = [];
        let errors = 0;

        function log(msg, isError = false) {
            const icon = isError ? '❌' : '✅';
            logs.push(`<div>${icon} ${msg}</div>`);
            if (isError) errors++;
        }

        if (typeof data !== 'undefined' && Object.keys(data).length > 0) {
            log(`資料庫讀取成功`);
        } else {
            log(`資料庫錯誤`, true);
        }

        const requiredIds = ['intro', 'types', 'theory', 'dilemma'];
        let missingIds = [];
        requiredIds.forEach(id => {
            if (!document.getElementById(id)) missingIds.push(id);
        });

        if (missingIds.length === 0) log(`HTML 結構完整`);
        else log(`HTML 缺少區塊`, true);

        // 檢查 CSS 變數是否生效 (檢查顏色)
        const testColor = getComputedStyle(document.documentElement).getPropertyValue('--primary');
        if (testColor && testColor.trim() !== '') log(`樣式系統正常 (有顏色)`);
        else log(`樣式系統異常 (沒有顏色)`, true);

        if (errors === 0) {
            consoleDiv.style.background = '#27ae60';
            consoleDiv.innerHTML = `<strong>系統正常運行中</strong><br>` + logs.join('');
            setTimeout(() => { consoleDiv.style.display = 'none'; }, 3000);
        } else {
            consoleDiv.style.background = '#c0392b';
            consoleDiv.innerHTML = `<strong>偵測到錯誤</strong><br>` + logs.join('');
        }
    }

    // 啟動
    render();
    // runSystemCheck()
</script>

</body>
</html>
